[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-agent-mini-project"
version = "0.1.0"
description = "A lightweight RAG assistant for document question answering"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "gradio==6.10.0",
  "openai==2.30.0",
  "chromadb==0.5.23",
  "sentence-transformers==3.4.1",
  "PyPDF2==3.0.1",
  "python-dotenv==1.0.1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
